search_all_missing_subtitles:
  name: "Search All Missing Subtitles"
  description: "Trigger Bazarr wanted search for missing subtitles (may download automatically per Bazarr settings)"
  fields:
    config_entry_id:
      name: Config Entry
      description: The config entry ID for the Bazarr Sync integration
      required: true
      selector:
        config_entry:
          integration: bazarr_sync
    scope:
      name: Scope
      description: Which media types to search
      required: false
      default: all
      selector:
        select:
          options:
            - all
            - movies
            - episodes

sync_all_subtitles:
  name: "Sync All Available Subtitles"
  description: "Synchronize all eligible external subtitles (CPU intensive, runs in background). Each PATCH just submits to Bazarr queue; physical sync completes asynchronously."
  fields:
    config_entry_id:
      name: Config Entry
      description: The config entry ID for the Bazarr Sync integration
      required: true
      selector:
        config_entry:
          integration: bazarr_sync
    scope:
      name: Scope
      description: Which media types to sync
      required: false
      default: all
      selector:
        select:
          options:
            - all
            - movies
            - episodes
    language:
      name: Language
      description: Limit to subtitles matching this language (optional, e.g. en, pt-BR)
      required: false
      selector:
        text:

get_bulk_sync_status:
  name: "Get Bulk Sync Status"
  description: "Get status of a background bulk sync job"
  fields:
    config_entry_id:
      name: Config Entry
      description: The config entry ID for the Bazarr Sync integration
      required: true
      selector:
        config_entry:
          integration: bazarr_sync
    job_id:
      name: Job ID
      description: Bulk sync job identifier returned by sync_all_subtitles
      required: true
      selector:
        text:

search_subtitles:
  name: "Search Subtitles (Advanced / API)"
  description: "Search for available subtitles for a movie or episode using internal IDs"
  fields:
    config_entry_id:
      name: Config Entry
      description: The config entry ID for the Bazarr Sync integration
      required: true
      selector:
        config_entry:
          integration: bazarr_sync
    media_type:
      name: Media Type
      description: Type of media (movie or episode)
      required: true
      selector:
        select:
          options:
            - movie
            - episode
    media_id:
      name: Media ID
      description: Radarr ID (movie) or Sonarr Episode ID (episode)
      required: true
      selector:
        number:
          min: 1
    series_id:
      name: Series ID
      description: Sonarr Series ID (required for episodes)
      required: false
      selector:
        number:
          min: 1

