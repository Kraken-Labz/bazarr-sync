find_subtitles:
  name: "Find Subtitles"
  description: "Search for available subtitles for a movie or episode using human-readable identifiers"
  fields:
    config_entry_id:
      name: Config Entry
      description: The config entry ID for the Bazarr Sync integration
      required: true
      selector:
        config_entry:
          integration: bazarr_sync
    media_type:
      name: Media Type
      description: Type of media (movie or episode)
      required: true
      selector:
        select:
          options:
            - movie
            - episode
    title:
      name: Title
      description: Movie title, or series title when Media Type is Episode
      required: true
      selector:
        text:
    year:
      name: Year
      description: Movie or series year. Use it when multiple titles have the same name.
      required: false
      selector:
        number:
          min: 1900
          max: 2100
    season:
      name: Season
      description: Season number (required for episodes)
      required: false
      selector:
        number:
          min: 1
    episode:
      name: Episode
      description: Episode number (required for episodes)
      required: false
      selector:
        number:
          min: 1

