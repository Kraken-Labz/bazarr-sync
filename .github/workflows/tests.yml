name: Tests

on: ['push', 'pull_request']

jobs:
  hacs:
    runs-on: ubuntu-latest
    name: HACS Action
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    name: Lint & Type Check
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy pytest pytest-asyncio aiohttp homeassistant

      - name: Ruff Check
        run: ruff check custom_components/bazarr_sync/

      - name: MyPy Check
        run: mypy custom_components/bazarr_sync/ --ignore-missing-imports

      - name: Black Check
        run: black --check .

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiohttp homeassistant

      - name: Run Tests
        run: python -m pytest tests/ -v
